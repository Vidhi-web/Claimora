# =============================================================================
# Claimora Backend Configuration
# =============================================================================
spring.application.name=backend
server.port=8080

# -----------------------------------------------------------------------------
# Database Configuration (PostgreSQL)
# Reads DB settings from environment variables with safe development defaults.
# ZERO CREDENTIALS in repo.
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/claimora}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# JPA / Hibernate Configuration
# schema.sql is the single source of truth for the database schema.
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -----------------------------------------------------------------------------
# CORS & Web Settings
# -----------------------------------------------------------------------------
claimora.cors.allowed-origins=http://localhost:4200

# -----------------------------------------------------------------------------
# Protected File Storage & OCR Settings
# -----------------------------------------------------------------------------
claimora.storage.location=${STORAGE_PATH:./storage/uploads}
claimora.ocr.tessdata-path=${TESSDATA_PREFIX:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
