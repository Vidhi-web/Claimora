# =============================================================================
# Claimora Backend Configuration
# =============================================================================
spring.application.name=backend
server.port=8080

# -----------------------------------------------------------------------------
# Database Configuration (PostgreSQL)
# Reads DB settings from environment variables with safe development defaults.
# ZERO CREDENTIALS in repo.
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/claimora}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ddl-auto=update: Hibernate creates/updates tables automatically.
# Use 'validate' once schema is stable in production.
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# SSL required for Supabase
spring.datasource.hikari.data-source-properties.sslmode=require
# Supabase Session Pooler drops idle connections after 5 min — keep max-lifetime below that
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000

# -----------------------------------------------------------------------------
# CORS & Web Settings
# -----------------------------------------------------------------------------
claimora.cors.allowed-origins=http://localhost:4200

# -----------------------------------------------------------------------------
# Protected File Storage & OCR Settings
# -----------------------------------------------------------------------------
claimora.storage.location=${STORAGE_PATH:./storage/uploads}
claimora.ocr.tessdata-path=${TESSDATA_PREFIX:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# -----------------------------------------------------------------------------
# SpringDoc / Swagger UI
# Swagger UI:  http://localhost:8080/swagger-ui.html
# API JSON:    http://localhost:8080/v3/api-docs
# -----------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.packages-to-scan=com.claimora.controller
springdoc.show-actuator=false

# -----------------------------------------------------------------------------
# Logging Configuration
# Logs: console (INFO) + rolling file at logs/claimora.log
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.claimora=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

logging.file.name=logs/claimora.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.file-name-pattern=logs/claimora-%d{yyyy-MM-dd}.%i.log.gz

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %m%n%wEx
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
