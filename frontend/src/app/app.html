<div class="app-shell" [class.sidebar-collapsed]="sidebarCollapsed()">

  <!-- ═══════════════════════════════════════════════════════
       LEFT SIDEBAR — visible only when authenticated
       ═══════════════════════════════════════════════════════ -->
  <aside class="sidebar" *ngIf="isDashboardLayout()">

    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L4 6v6c0 5.5 3.4 10.7 8 12 4.6-1.3 8-6.5 8-12V6L12 2z"
                fill="#3b82f6" fill-opacity="0.2"
                stroke="#3b82f6" stroke-width="1.75" stroke-linejoin="round"/>
          <path d="M9 12l2 2 4-4" stroke="#3b82f6" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-text-wrap">
        <span class="brand-name">Claimora</span>
        <span class="brand-sub">Fraud Risk Platform</span>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav" aria-label="Main navigation">

      <div class="nav-group">
        <a id="nav-dashboard" class="nav-item"
           routerLink="/dashboard" routerLinkActive="active"
           [routerLinkActiveOptions]="{exact: true}" title="Dashboard">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M2 10a8 8 0 018-8v8h8a8 8 0 11-16 0z"/>
            <path d="M12 2.252A8.014 8.014 0 0117.748 8H12V2.252z"/>
          </svg>
          <span class="nav-label">Dashboard</span>
        </a>

        <a id="nav-products" class="nav-item"
           routerLink="/products" routerLinkActive="active" title="Products">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM14 11a1 1 0 011 1v1h1a1 1 0 110 2h-1v1a1 1 0 11-2 0v-1h-1a1 1 0 110-2h1v-1a1 1 0 011-1z" clip-rule="evenodd"/>
          </svg>
          <span class="nav-label">Products</span>
        </a>

        <a id="nav-claims" class="nav-item"
           routerLink="/claims" routerLinkActive="active" title="All Claims">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/>
          </svg>
          <span class="nav-label">All Claims</span>
        </a>

        <a id="nav-evidence" class="nav-item"
           routerLink="/evidence" routerLinkActive="active" title="Evidence Explorer">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
          </svg>
          <span class="nav-label">Evidence Explorer</span>
        </a>

        <a id="nav-findings" class="nav-item"
           routerLink="/findings" routerLinkActive="active" title="Findings">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          <span class="nav-label">Findings</span>
        </a>

        <a id="nav-investigations" class="nav-item"
           routerLink="/investigations" routerLinkActive="active" title="Investigation History">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z" clip-rule="evenodd"/>
            <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/>
          </svg>
          <span class="nav-label">Investigation History</span>
        </a>

        <a id="nav-reports" class="nav-item"
           routerLink="/reports" routerLinkActive="active" title="Reports">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414A2 2 0 0015.414 6L12 2.586A2 2 0 0010.586 2H6zm2 10a1 1 0 10-2 0v3a1 1 0 102 0v-3zm2-3a1 1 0 011 1v5a1 1 0 11-2 0v-5a1 1 0 011-1zm4-1a1 1 0 10-2 0v7a1 1 0 102 0V8z" clip-rule="evenodd"/>
          </svg>
          <span class="nav-label">Reports</span>
        </a>
      </div>

      <!-- Bottom Nav Group (Admin + Settings) -->
      <div class="nav-group nav-group-bottom">
        <a id="nav-users" class="nav-item nav-item-admin"
           *ngIf="authService.isAdmin()"
           routerLink="/users" routerLinkActive="active" title="User Management">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/>
          </svg>
          <span class="nav-label">User Management</span>
        </a>

        <a id="nav-profile" class="nav-item"
           routerLink="/profile" routerLinkActive="active" title="Profile & Settings">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
          </svg>
          <span class="nav-label">Profile &amp; Settings</span>
        </a>
      </div>

    </nav>

    <!-- Collapse Toggle -->
    <button id="sidebar-collapse-btn" class="sidebar-collapse-btn"
            type="button" (click)="toggleSidebar()"
            [title]="sidebarCollapsed() ? 'Expand menu' : 'Collapse menu'">
      <svg class="nav-icon collapse-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/>
      </svg>
      <span class="nav-label">Collapse Menu</span>
    </button>

  </aside>

  <!-- ═══════════════════════════════════════════════════════
       MAIN WRAPPER (header + content)
       ═══════════════════════════════════════════════════════ -->
  <div class="main-wrapper" [class.with-sidebar]="isDashboardLayout()">

    <!-- ── Top Header ── -->
    <header class="top-header" *ngIf="isDashboardLayout()">

      <button id="sidebar-toggle-btn" class="header-btn header-toggle"
              type="button" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
        </svg>
      </button>

      <!-- Global Search -->
      <form class="header-search" id="global-search-form" (submit)="onSearch($event)" role="search">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
        </svg>
        <input id="global-search-input"
               type="search" class="search-input"
               placeholder="Search by Claim ID, Invoice No., Serial No., Customer name..."
               [(ngModel)]="searchQuery" name="searchQuery"
               autocomplete="off" aria-label="Global search"/>
      </form>

      <div class="header-right">
        <!-- Notifications icon (placeholder — no real notification endpoint) -->
        <button id="header-notifications-btn" class="header-btn" type="button" title="Notifications" aria-label="Notifications">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/>
          </svg>
        </button>

        <!-- Divider -->
        <div class="header-divider"></div>

        <!-- User -->
        <div class="user-chip" id="header-user-chip"
             routerLink="/profile" role="button" tabindex="0">
          <div class="user-avatar" aria-hidden="true">{{ getUserInitial() }}</div>
          <div class="user-info">
            <span class="user-display-name">{{ authService.currentUser()?.name }}</span>
            <span class="user-role-badge"
                  [ngClass]="authService.currentUser()?.role?.toLowerCase() || ''">
              {{ authService.currentUser()?.role }}
            </span>
          </div>
        </div>

        <button id="header-signout-btn" class="btn btn-sm btn-ghost signout-btn"
                type="button" (click)="onLogout()">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"/>
          </svg>
          Sign Out
        </button>
      </div>
    </header>

    <!-- ── Main Content ── -->
    <main class="main-content" id="main-content" role="main">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
